
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fexa Tools — Free Online Tools</title>
<meta name="description" content="Free online text, calculator and developer tools.">
<style>
:root{--bg:#f7f8fc;--ink:#171a2b;--muted:#697087;--line:#e5e8f1;--blue:#4f46e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Arial,sans-serif}
header{background:white;border-bottom:1px solid var(--line);padding:16px 5%;font-size:24px;font-weight:850}
header span{color:var(--blue)}
main{max-width:1100px;margin:auto;padding:24px 16px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.12;margin:12px 0}
h1 span{color:var(--blue)}
p{color:var(--muted)}
.search{display:flex;gap:8px;margin:20px 0}
input,textarea,select{width:100%;padding:12px;border:1px solid #dfe3ee;border-radius:11px;font:inherit;background:white}
textarea{min-height:130px}
button{border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}
.secondary,.chip{background:#eef0f8;color:#30364e}
.categories{display:flex;gap:8px;overflow:auto;margin:15px 0}
.chip{white-space:nowrap}
.chip.active{background:#e4e7ff;color:#3730a3}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.card,.workspace{background:white;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 8px 24px #20264b0b}
.card h3{margin:5px 0;font-size:16px}
.card p{font-size:13px;min-height:40px}
.card button{width:100%}
.icon{font-size:22px}
.workspace{margin-top:24px}
.workspace[hidden]{display:none}
.head{display:flex;justify-content:space-between;gap:10px}
.head h2{margin:0}
.label{display:block;margin:12px 0 5px;font-weight:700;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.output{background:#f8f9fd;border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:65px}
.status{color:#b42318;font-size:13px}
.ad{margin:20px 0;min-height:55px;border:1px dashed #d8dcea;border-radius:10px;display:grid;place-items:center;color:#8990a6;font-size:11px}
footer{text-align:center;padding:25px;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:440px){.grid{grid-template-columns:1fr}.search{flex-direction:column}}
</style>
</head>
<body>
<header>Fexa <span>Tools</span></header>

<main>
<section>
<small>FREE ONLINE TOOLKIT</small>
<h1>Useful tools for <span>everyday work.</span></h1>
<p>Free browser-based text tools, calculators and developer utilities. No account needed.</p>
<div class="search">
<input id="search" placeholder="Search tools..." aria-label="Search tools">
<button class="primary" id="searchBtn" type="button">Search</button>
</div>
</section>

<div class="ad">ADVERTISEMENT</div>
<h2>Explore tools <small id="count" style="color:#697087;font-size:13px"></small></h2>
<div class="categories" id="categories"></div>
<section class="grid" id="grid"></section>
<div class="ad">ADVERTISEMENT</div>

<section class="workspace" id="workspace" hidden>
<div class="head">
<div><h2 id="title"></h2><p id="description"></p></div>
<button class="secondary" id="close" type="button">Close ✕</button>
</div>
<div id="inputs"></div>
<div class="actions">
<button class="primary" id="run" type="button">Run tool</button>
<button class="secondary" id="clear" type="button">Clear</button>
<button class="secondary" id="copy" type="button">Copy result</button>
<button class="secondary" id="download" type="button">Download</button>
</div>
<div class="status" id="status"></div>
<b class="label">Result</b>
<div class="output" id="result">Your result will appear here.</div>
</section>
</main>

<footer>© <span id="year"></span> Fexa Tools · Free browser-based utilities</footer>

<script>
"use strict";

const $ = id => document.getElementById(id);

const data = [
["Text","Word & Character Counter","🔤","Count words, characters and lines."],
["Text","Case Converter","Aa","Convert uppercase, lowercase and title case."],
["Text","Remove Extra Spaces","↵","Clean extra spaces and blank lines."],
["Text","Duplicate Line Remover","☷","Remove repeated lines."],
["Text","Reverse Text","⇄","Reverse your text."],
["Text","Lorem Ipsum Generator","¶","Generate placeholder text."],
["Text","Find and Replace Text","⌕","Replace a phrase in your text."],
["Text","Text to Binary Converter","01","Convert text to binary."],
["Text","Word Frequency Counter","▤","Count repeated words."],
["Text","Alphabetical List Sorter","↕","Sort lines alphabetically."],
["Text","Line Numbering Tool","№","Add line numbers."],
["Text","Text Summarizer","≡","Create a basic extractive summary."],
["Text","Grammar & Sentence Refiner","✎","Fix common spacing."],
["Text","Email & Message Writer","✉","Draft a basic message."],
["Text","Poetry Prompt Generator","♡","Create a poetry prompt."],
["Developer","JSON Formatter & Validator","{}","Format and validate JSON."],
["Developer","Base64 Encoder / Decoder","64","Encode or decode Base64."],
["Developer","URL Encoder / Decoder","🔗","Encode or decode URL text."],
["Developer","URL Slug Generator","🔗","Create a URL-friendly slug."],
["Developer","UUID Generator","🆔","Generate a UUID."],
["Developer","HTML Entity Encoder","</>","Encode HTML special characters."],
["Developer","HTML Entity Decoder","<>","Decode HTML entities."],
["Developer","Password Strength Checker","🔐","Estimate password strength."],
["Calculator","Percentage & Discount Calculator","%","Calculate percentage and discount."],
["Calculator","Age Calculator","🎂","Calculate age from birth date."],
["Calculator","Temperature Converter","🌡","Convert Celsius, Fahrenheit and Kelvin."],
["Calculator","Data Storage Converter","💾","Convert KB, MB, GB and TB."],
["Calculator","Leap Year Checker","📅","Check leap years."],
["Calculator","BMI Calculator","⚖","Calculate body mass index."],
["Calculator","Average Calculator","∑","Calculate an average."],
["Calculator","Random Number Generator","🎲","Generate a random number."],
["Utility","Daily Planner Template","🗓","Create a simple daily plan."],
["Utility","Checklist Maker","☑","Turn lines into a checklist."],
["Utility","Social Media Image Size Guide","📱","View common image sizes."],
["Utility","Read Time Calculator","◷","Estimate reading time."]
];

const cats = ["All","Text","Developer","Calculator","Utility"];
let active = "All";
let selected = null;

function esc(s) {
 return String(s).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

function renderCats() {
 $("categories").innerHTML = cats.map(c =>
  `<button type="button" class="chip ${active===c?"active":""}" data-cat="${c}">${c==="All"?"All tools":c}</button>`
 ).join("");
}

function render() {
 const q = $("search").value.trim().toLowerCase();
 const list = data.filter(t =>
  (active==="All" || t[0]===active) &&
  (!q || t.join(" ").toLowerCase().includes(q))
 );
 $("count").textContent = `— ${list.length} tools`;
 $("grid").innerHTML = list.map(t =>
  `<article class="card">
   <div class="icon">${t[2]}</div>
   <h3>${esc(t[1])}</h3>
   <p>${esc(t[3])}</p>
   <button type="button" class="primary" data-open="${data.indexOf(t)}">Open Tool</button>
  </article>`
 ).join("") || "<p>No tools found. Try another search.</p>";
}

function openTool(index) {
 selected = data[Number(index)];
 if (!selected) return;

 const name = selected[1];
 $("title").textContent = name;
 $("description").textContent = selected[3];

 let extra = "";

 if(name==="Find and Replace Text")
  extra='<label class="label">Find</label><input id="find" placeholder="Find this text"><label class="label">Replace with</label><input id="replace" placeholder="Replacement">';

 if(name==="Lorem Ipsum Generator")
  extra='<label class="label">Paragraphs (1–10)</label><input id="amount" type="number" min="1" max="10" value="3">';

 if(name==="Percentage & Discount Calculator")
  extra='<label class="label">Original amount</label><input id="a" type="number" value="100"><label class="label">Percentage</label><input id="b" type="number" value="15">';

 if(name==="Age Calculator")
  extra='<label class="label">Date of birth</label><input id="birth" type="date">';

 if(name==="Temperature Converter")
  extra='<label class="label">Value</label><input id="a" type="number" value="25"><label class="label">Convert from</label><select id="unit"><option>C</option><option>F</option><option>K</option></select>';

 if(name==="Data Storage Converter")
  extra='<label class="label">Value</label><input id="a" type="number" value="1"><label class="label">Unit</label><select id="unit"><option>KB</option><option>MB</option><option>GB</option><option>TB</option></select>';

 if(name==="Leap Year Checker")
  extra='<label class="label">Year</label><input id="a" type="number" value="2028">';

 if(name==="BMI Calculator")
  extra='<label class="label">Weight (kg)</label><input id="a" type="number" value="60"><label class="label">Height (cm)</label><input id="b" type="number" value="170">';

 if(name==="Random Number Generator")
  extra='<label class="label">Minimum</label><input id="a" type="number" value="1"><label class="label">Maximum</label><input id="b" type="number" value="100">';

 const noText = [
  "Age Calculator","Temperature Converter","Data Storage Converter",
  "Leap Year Checker","Social Media Image Size Guide","Daily Planner Template"
 ].includes(name);

 $("inputs").innerHTML =
  (noText ? "" : '<label class="label" for="input">Enter text or data</label><textarea id="input" placeholder="Type or paste here..."></textarea>') + extra;

 $("result").textContent = "Your result will appear here.";
 $("status").textContent = "";
 $("workspace").hidden = false;
 $("workspace").scrollIntoView({behavior:"smooth",block:"start"});
}

function get(id) {
 const el = $(id);
 return el ? el.value : "";
}

function runTool() {
 if (!selected) return;

 const name = selected[1];
 const v = get("input");
 let r = "";

 try {
  switch(name) {
   case "Word & Character Counter":
    r=`Characters: ${v.length}\nWords: ${v.trim()?v.trim().split(/\s+/).length:0}\nLines: ${v?v.split(/\r?\n/).length:0}`;
    break;

   case "Case Converter":
    r=`UPPERCASE:\n${v.toUpperCase()}\n\nlowercase:\n${v.toLowerCase()}\n\nTitle Case:\n${v.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase())}`;
    break;

   case "Remove Extra Spaces":
    r=v.split(/\r?\n/).map(s=>s.replace(/[ \t]+/g," ").trim()).filter(Boolean).join("\n");
    break;

   case "Duplicate Line Remover":
    r=[...new Set(v.split(/\r?\n/))].join("\n");
    break;

   case "Reverse Text":
    r=Array.from(v).reverse().join("");
    break;

   case "Lorem Ipsum Generator":
    r=Array(Math.max(1,Math.min(10,Number(get("amount"))||3))).fill("Lorem ipsum dolor sit amet, consectetur adipiscing elit. Integer vitae justo sed sapien tempor tincidunt.").join("\n\n");
    break;

   case "Find and Replace Text":
    r=get("find") ? v.split(get("find")).join(get("replace")) : "Enter text to find.";
    break;

   case "Text to Binary Converter":
    r=Array.from(new TextEncoder().encode(v)).map(b=>b.toString(2).padStart(8,"0")).join(" ");
    break;

   case "Word Frequency Counter": {
    const m={};
    (v.toLowerCase().match(/[a-z0-9']+/g)||[]).forEach(w=>m[w]=(m[w]||0)+1);
    r=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([w,c])=>`${w}: ${c}`).join("\n");
    break;
   }

   case "Alphabetical List Sorter":
    r=v.split(/\r?\n/).sort((a,b)=>a.localeCompare(b)).join("\n");
    break;

   case "Line Numbering Tool":
    r=v.split(/\r?\n/).map((s,i)=>`${i+1}. ${s}`).join("\n");
    break;

   case "Text Summarizer": {
    const s=v.split(/(?<=[.!?])\s+/).filter(Boolean);
    r=s.slice(0,Math.max(1,Math.ceil(s.length/3))).join(" ")||"Enter text first.";
    break;
   }

   case "Grammar & Sentence Refiner":
    r=v.replace(/\s+/g," ").trim().replace(/\bi\b/g,"I").replace(/\s+([,.!?])/g,"$1");
    break;

   case "Email & Message Writer":
    r=v?`Hello,\n\nI am writing regarding ${v}. Please let me know when you are available to discuss this.\n\nThank you.`:"Enter the message purpose first.";
    break;

   case "Poetry Prompt Generator":
    r=v?`Write original heartfelt poetry about "${v}". Use natural language and vivid imagery.`:"Enter a theme first.";
    break;

   case "JSON Formatter & Validator":
    r=JSON.stringify(JSON.parse(v),null,2);
    break;

   case "Base64 Encoder / Decoder":
    try { r=decodeURIComponent(escape(atob(v.trim()))); }
    catch(e) { r=btoa(unescape(encodeURIComponent(v))); }
    break;

   case "URL Encoder / Decoder":
    try { r=decodeURIComponent(v); }
    catch(e) { r=encodeURIComponent(v); }
    break;

   case "URL Slug Generator":
    r=v.toLowerCase().trim().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    break;

   case "UUID Generator":
    r=crypto.randomUUID ? crypto.randomUUID() : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const x=Math.random()*16|0;return(c==="x"?x:(x&3|8)).toString(16)});
    break;

   case "HTML Entity Encoder":
    r=v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
    break;

   case "HTML Entity Decoder": {
    const t=document.createElement("textarea");
    t.innerHTML=v;
    r=t.value;
    break;
   }

   case "Password Strength Checker": {
    let s=0;
    if(v.length>=8)s++;
    if(v.length>=12)s++;
    if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;
    if(/\d/.test(v))s++;
    if(/[^A-Za-z0-9]/.test(v))s++;
    r=`Strength: ${["Very weak","Weak","Fair","Good","Strong","Very strong"][s]}\nLength: ${v.length}`;
    break;
   }

   case "Percentage & Discount Calculator": {
    const a=Number(get("a")),b=Number(get("b"));
    r=`${b}% of ${a}: ${(a*b/100).toFixed(2)}\nPrice after discount: ${(a-a*b/100).toFixed(2)}`;
    break;
   }

   case "Age Calculator": {
    const d=new Date(get("birth"));
    if(!get("birth")||isNaN(d))throw Error("Choose a valid birth date.");
    const now=new Date();
    let age=now.getFullYear()-d.getFullYear();
    if(now.getMonth()<d.getMonth()||(now.getMonth()===d.getMonth()&&now.getDate()<d.getDate()))age--;
    r=`Age: ${age} years`;
    break;
   }

   case "Temperature Converter": {
    const x=Number(get("a")),u=get("unit");
    const c=u==="C"?x:u==="F"?(x-32)*5/9:x-273.15;
    r=`Celsius: ${c.toFixed(2)} °C\nFahrenheit: ${(c*9/5+32).toFixed(2)} °F\nKelvin: ${(c+273.15).toFixed(2)} K`;
    break;
   }

   case "Data Storage Converter": {
    const x=Number(get("a")),u=get("unit");
    const k=x*1024**(["KB","MB","GB","TB"].indexOf(u));
    r=`KB: ${k}\nMB: ${k/1024}\nGB: ${k/1024**2}\nTB: ${k/1024**3}`;
    break;
   }

   case "Leap Year Checker": {
    const y=Number(get("a"));
    r=`${y} ${((y%4===0&&y%100!==0)||y%400===0)?"is":"is not"} a leap year.`;
    break;
   }

   case "BMI Calculator": {
    const w=Number(get("a")),h=Number(get("b"))/100;
    if(w<=0||h<=0)throw Error("Enter positive weight and height.");
    r=`BMI: ${(w/(h*h)).toFixed(1)}`;
    break;
   }

   case "Average Calculator": {
    const a=v.split(/[,\s]+/).map(Number).filter(Number.isFinite);
    r=a.length?`Average: ${a.reduce((x,y)=>x+y,0)/a.length}`:"Enter numbers separated by commas.";
    break;
   }

   case "Random Number Generator": {
    let a=Number(get("a")),b=Number(get("b"));
    if(a>b)[a,b]=[b,a];
    r=String(Math.floor(Math.random()*(b-a+1))+a);
    break;
   }

   case "Social Media Image Size Guide":
    r="Instagram post: 1080 × 1080 px\nInstagram story: 1080 × 1920 px\nYouTube thumbnail: 1280 × 720 px\nFacebook post: 1200 × 630 px";
    break;

   case "Daily Planner Template":
    r="Top priorities:\n1.\n2.\n3.\n\nMorning:\nAfternoon:\nEvening:\nNotes:";
    break;

   case "Checklist Maker":
    r=v.split(/\r?\n/).filter(Boolean).map(x=>"- [ ] "+x).join("\n");
    break;

   case "Read Time Calculator":
    r=`Words: ${v.trim()?v.trim().split(/\s+/).length:0}\nEstimated reading time: ${Math.max(1,Math.ceil((v.trim()?v.trim().split(/\s+/).length:0)/200))} minute(s)`;
    break;

   default:
    r="This tool is listed in the catalogue but is not implemented in this version yet.";
  }

  $("result").textContent=r;
  $("status").textContent="";
 } catch(e) {
  $("result").textContent="";
  $("status").textContent="Could not process input: "+e.message;
 }
}

$("run").addEventListener("click",runTool);

$("clear").addEventListener("click",()=>{
 const el=$("input");
 if(el)el.value="";
 ["find","replace","amount","birth","a","b","unit"].forEach(id=>{const e=$(id);if(e)e.value=""});
 $("result").textContent="Your result will appear here.";
 $("status").textContent="";
});

$("copy").addEventListener("click",async()=>{
 try {
  await navigator.clipboard.writeText($("result").textContent);
  $("status").textContent="Result copied.";
 } catch(e) {
  $("status").textContent="Clipboard blocked. Select and copy the result manually.";
 }
});

$("download").addEventListener("click",()=>{
 const blob=new Blob([$("result").textContent],{type:"text/plain;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="fexa-tools-result.txt";
 document.body.appendChild(a);
 a.click();
 a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
});

$("categories").addEventListener("click",e=>{
 const b=e.target.closest("[data-cat]");
 if(!b)return;
 active=b.dataset.cat;
 renderCats();
 render();
});

$("grid").addEventListener("click",e=>{
 const b=e.target.closest("[data-open]");
 if(b)openTool(b.dataset.open);
});

$("search").addEventListener("input",render);
$("searchBtn").addEventListener("click",render);
$("search").addEventListener("keydown",e=>{if(e.key==="Enter")render()});
$("close").addEventListener("click",()=>{$("workspace").hidden=true;selected=null});

$("year").textContent=new Date().getFullYear();
renderCats();
render();
</script>
</body>
</html>
