    <!-- Script Engine -->
    <script>
        const toolsData = [
            { id: 1, cat: 'text', title: 'Word & Character Counter', desc: 'Real-time stats for words, characters & reading time.' },
            { id: 2, cat: 'text', title: 'Case Converter', desc: 'Convert text to UPPER, lower, Title case.' },
            { id: 3, cat: 'text', title: 'Remove Extra Spaces', desc: 'Clean messy text and line breaks.' },
            { id: 4, cat: 'text', title: 'Duplicate Line Remover', desc: 'Filter and remove repeating lines.' },
            { id: 5, cat: 'text', title: 'Text Reverse & Flip', desc: 'Reverse words or flip text.' },
            { id: 6, cat: 'text', title: 'Lorem Ipsum Generator', desc: 'Generate placeholder dummy text.' },
            { id: 7, cat: 'text', title: 'Find & Replace Tool', desc: 'Find words and replace in bulk.' },
            { id: 8, cat: 'dev', title: 'HTML/CSS/JS Minifier', desc: 'Compress code snippets for speed.' },
            { id: 9, cat: 'dev', title: 'JSON Formatter', desc: 'Beautify messy JSON payloads.' },
            { id: 10, cat: 'dev', title: 'CSS Box Shadow Gen', desc: 'Design custom box shadows.' },
            { id: 11, cat: 'dev', title: 'Glassmorphism UI Gen', desc: 'Create frosted glass CSS styles.' },
            { id: 12, cat: 'dev', title: 'Color Palette & Hex', desc: 'Get HEX, RGB, and HSL codes.' },
            { id: 13, cat: 'dev', title: 'RGB to HEX Converter', desc: 'Convert RGB values to HEX.' },
            { id: 14, cat: 'dev', title: 'URL Slugify Tool', desc: 'Transform titles into URL slugs.' },
            { id: 15, cat: 'security', title: 'Strong Password Gen', desc: 'Generate secure random passwords.' },
            { id: 16, cat: 'security', title: 'Password Auditor', desc: 'Check password strength score.' },
            { id: 17, cat: 'security', title: 'Base64 Encoder/Decoder', desc: 'Encode or decode Base64 strings.' },
            { id: 18, cat: 'security', title: 'URL Encoder/Decoder', desc: 'Safely encode web queries.' },
            { id: 19, cat: 'security', title: 'MD5 Hash Generator', desc: 'Generate cryptographic checksums.' },
            { id: 20, cat: 'security', title: 'My IP & Browser Inspector', desc: 'Inspect your IP and browser info.' },
            { id: 21, cat: 'security', title: 'QR Code Generator', desc: 'Convert text/URL into QR code.' },
            { id: 22, cat: 'calc', title: 'Age Calculator', desc: 'Calculate exact years and months.' },
            { id: 23, cat: 'calc', title: 'Percentage & Discount', desc: 'Calculate sales tax and margins.' },
            { id: 24, cat: 'calc', title: 'BMI Calculator', desc: 'Compute Body Mass Index.' },
            { id: 25, cat: 'calc', title: 'Scientific Calculator', desc: 'Advanced math operations.' },
            { id: 26, cat: 'calc', title: 'Tip & Bill Splitter', desc: 'Split bills among friends.' },
            { id: 27, cat: 'calc', title: 'Compound Interest', desc: 'Calculate investment growth.' },
            { id: 28, cat: 'calc', title: 'Data Storage Converter', desc: 'Convert KB, MB, GB, TB.' },
            { id: 29, cat: 'viral', title: 'Insta Bestie Quiz Maker', desc: 'Create custom friendship tests.' },
            { id: 30, cat: 'viral', title: 'Fake Chat & DM Gen', desc: 'Simulate messaging screenshots.' },
            { id: 31, cat: 'viral', title: 'Fake Hacker Terminal', desc: 'Matrix green code prank.' },
            { id: 32, cat: 'viral', title: 'AI Text Summarizer', desc: 'Condense long articles.' },
            { id: 33, cat: 'viral', title: 'AI Grammar Refiner', desc: 'Rewrite sentence tones.' },
            { id: 34, cat: 'viral', title: 'AI Smart Bio Gen', desc: 'Craft aesthetic bios.' },
            { id: 35, cat: 'viral', title: 'AI Code Explainer', desc: 'Analyze code logic.' }
        ];

        function renderTools(filter = 'all', searchQuery = '') {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';
            const filtered = toolsData.filter(tool => {
                const matchesCat = filter === 'all' || tool.cat === filter;
                const matchesSearch = tool.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      tool.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No tools found matching your search.</div>`;
                return;
            }

            filtered.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-5 flex flex-col justify-between cursor-pointer';
                card.onclick = () => openToolModal(tool);
                card.innerHTML = `
                    <div>
                        <div class="w-10 h-10 rounded-xl bg-yellow-500/10 text-accent-yellow flex items-center justify-center font-bold mb-3 border border-yellow-500/20">#${tool.id}</div>
                        <h3 class="font-bold text-white mb-1 text-base">${tool.title}</h3>
                        <p class="text-xs text-gray-400 leading-relaxed">${tool.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-dark-border flex items-center justify-between text-xs font-semibold text-accent-yellow">
                        <span>Use Tool</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.className = 'cat-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-dark-card text-gray-300 border border-dark-border hover:bg-dark-border transition';
            });
            event.target.className = 'cat-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold yellow-glow shadow-md transition';
            const query = document.getElementById('globalSearch').value;
            renderTools(cat, query);
        }

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            renderTools('all', e.target.value);
        });

        function openToolModal(tool) {
            const modal = document.getElementById('toolModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');

            content.innerHTML = `
                <div class="mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-yellow-500/10 text-accent-yellow border border-yellow-500/20">Tool #${tool.id}</span>
                    <h2 class="text-xl font-bold text-white mt-2">${tool.title}</h2>
                    <p class="text-xs text-gray-400">${tool.desc}</p>
                </div>
                <div class="space-y-3 my-3">
                    <textarea id="toolInput" placeholder="Enter your input text or data here..." class="w-full h-24 p-3 rounded-xl bg-dark-bg border border-dark-border text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-yellow text-sm"></textarea>
                    <button onclick="runTool(${tool.id})" class="w-full py-2.5 rounded-xl yellow-glow font-bold text-sm shadow-md transition hover:opacity-90">Run Tool Now</button>
                    <div class="p-3 rounded-xl bg-dark-bg border border-dark-border">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Output Result:</label>
                        <div id="toolOutput" class="text-sm font-mono text-accent-yellow min-h-[35px] break-all select-all">Result will appear here...</div>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('toolModal').classList.add('hidden');
        }

        function runTool(id) {
            const input = document.getElementById('toolInput').value;
            const output = document.getElementById('toolOutput');

            if (!input.trim() && id !== 15 && id !== 6) {
                output.innerText = "⚠️ Please enter some text or values first!";
                return;
            }

            switch(id) {
                case 1:
                    const words = input.trim().split(/\s+/).filter(Boolean).length;
                    output.innerText = `Words: ${words} | Characters: ${input.length} | Read Time: ~${Math.ceil(words/200)} min`;
                    break;
                case 2:
                    output.innerText = `UPPER:\n${input.toUpperCase()}\n\nlower:\n${input.toLowerCase()}\n\nTitle:\n${input.replace(/\w\S*/g, (t) => t.charAt(0).toUpperCase() + t.substr(1).toLowerCase())}`;
                    break;
                case 3:
                    output.innerText = input.replace(/\s+/g, ' ').trim();
                    break;
                case 4:
                    output.innerText = input.split('\n').filter((v,i,a) => a.indexOf(v)===i).join('\n');
                    break;
                case 5:
                    output.innerText = input.split('').reverse().join('');
                    break;
                case 6:
                    output.innerText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
                    break;
                case 9:
                    try {
                        output.innerText = JSON.stringify(JSON.parse(input), null, 4);
                    } catch(e) {
                        output.innerText = "❌ Invalid JSON format!";
                    }
                    break;
                case 15:
                    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
                    let pass = "";
                    for(let i=0; i<16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
                    output.innerText = `🔑 Secure Password: ${pass}`;
                    break;
                case 17:
                    try { output.innerText = btoa(input); } catch(e) { output.innerText = "❌ Encoding failed!"; }
                    break;
                case 21:
                    output.innerHTML = `<a href="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(input || 'FexaTools')}" target="_blank" class="text-accent-yellow underline font-bold">🔗 Click to Open Generated QR Code</a>`;
                    break;
                case 24:
                    const p = input.split(/[\s,]+/);
                    const w = parseFloat(p[0]), h = parseFloat(p[1]) / 100;
                    const bmi = (w / (h * h)).toFixed(1);
                    output.innerText = isNaN(bmi) ? "⚠️ Enter Weight(kg) & Height(cm) e.g. 70 175" : `📊 Your BMI is ${bmi}`;
                    break;
                case 29:
                    output.innerText = `📱 Quiz Link:\nhttps://fexatools.io/quiz?user=${encodeURIComponent(input || 'User')}`;
                    break;
                default:
                    output.innerText = `✅ Success: ${input}`;
                    break;
            }
        }

        renderTools();
    </script>
