        function renderTools(filter = 'all', searchQuery = '') {
            const grid = document.getElementById('toolsGrid');
            grid.innerHTML = '';
            const filtered = toolsData.filter(tool => {
                const matchesCat = filter === 'all' || tool.cat === filter;
                const matchesSearch = tool.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      tool.desc.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No tools found matching your search.</div>`;
                return;
        }
            filtered.forEach(tool => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-5 flex flex-col justify-between cursor-pointer';
                card.onclick = () => openToolModal(tool);
                card.innerHTML = `
                    <div>
                        <div class="w-10 h-10 rounded-xl bg-yellow-500/10 text-accent-yellow flex items-center justify-center font-bold mb-3 border border-yellow-500/20">#${tool.id}</div>
                        <h3 class="font-bold text-white mb-1 text-base">${tool.title}</h3>
                        <p class="text-xs text-gray-400 leading-relaxed">${tool.desc}</p>
                    </div>
                    <div class="mt-4 pt-3 border-t border-dark-border flex items-center justify-between text-xs font-semibold text-accent-yellow">
                        <span>Use Tool</span>
                        <span>→</span>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-pill').forEach(btn => {
                btn.className = 'cat-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-dark-card text-gray-300 border border-dark-border hover:bg-dark-border transition';

            event.target.className = 'cat-pill px-3.5 py-1.5 rounded-xl text-xs font-semibold yellow-glow shadow-md transition';
            const query = document.getElementById('globalSearch').value;
            renderTools(cat, query);
        }

        document.getElementById('globalSearch').addEventListener('input', (e) => {
            renderTools('all', e.target.value);
        });

        function openToolModal(tool) {
            const modal = document.getElementById('toolModal');
            const content = document.getElementById('modalContent');
            modal.classList.remove('hidden');

            let placeholderText = "Enter your text or data here...";
            if(tool.cat === 'dev') placeholderText = "Enter code, JSON, or parameters here...";
            if(tool.cat === 'security') placeholderText = "Enter text to encode/hash or leave blank...";
            if(tool.cat === 'calc') placeholderText = "Enter numbers or values (e.g. 70 175)...";
            if(tool.cat === 'viral') placeholderText = "Enter names or topic (e.g. Ali & Ahmed)...";

            content.innerHTML = `
                <div class="mb-3">
                    <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-yellow-500/10 text-accent-yellow border border-yellow-500/20">Tool #${tool.id}</span>
                    <h2 class="text-xl font-bold text-white mt-2">${tool.title}</h2>
                    <p class="text-xs text-gray-400">${tool.desc}</p>
                </div>
                <div class="space-y-3 my-3">
                    <textarea id="toolInput" placeholder="${placeholderText}" class="w-full h-24 p-3 rounded-xl bg-dark-bg border border-dark-border text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-accent-yellow text-sm"></textarea>
                    <button onclick="executeRealTool(${tool.id})" class="w-full py-2.5 rounded-xl yellow-glow font-bold text-sm shadow-md transition hover:opacity-90">Execute Tool</button>
                    <div class="p-3 rounded-xl bg-dark-bg border border-dark-border">
                        <label class="block text-xs font-semibold text-gray-400 mb-1">Result Output:</label>
                        <div id="toolOutput" class="text-sm font-mono text-accent-yellow min-h-[35px] break-all select-all">Ready...</div>
                    </div>
                </div>
            `;

        function closeModal() {
            document.getElementById('toolModal').classList.add('hidden');
        }

        function executeRealTool(id) {
            const input = document.getElementById('toolInput').value.trim();
            const output = document.getElementById('toolOutput');

            if(id === 1) {
                if(!input) { output.innerText = "Please enter some text."; return; }
                const words = input.split(/\s+/).length;
                const chars = input.length;
                output.innerText = `Words: ${words} | Characters: ${chars} | Read Time: ~${Math.ceil(words/200)} min`;
            } else if(id === 2) {
                if(!input) { output.innerText = "Please enter text."; return; }
                output.innerText = `UPPER: ${input.toUpperCase()}\n\nlower: ${input.toLowerCase()}\n\nTitle: ${input.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase())}`;
            } else if(id === 3) {
                output.innerText = input.replace(/\s+/g, ' ').trim();
            } else if(id === 4) {
                output.innerText = input.split('\n').filter((v,i,a) => a.indexOf(v)===i).join('\n');
            } else if(id === 5) {
                output.innerText = input.split('').reverse().join('');
            } else if(id === 6) {
                output.innerText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
            } else if(id === 8) {
                output.innerText = input.split('').map(char => char.charCodeAt(0).toString(2).padStart(8, '0')).join(' ');
            } else if(id === 12) {
                try {
                    const parsed = JSON.parse(input);
                    output.innerText = JSON.stringify(parsed, null, 4);
                } catch(e) {
                    output.innerText = "Invalid JSON syntax!";
                }
            } else if(id === 21) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%&*!";
                let pass = "";
                for(let i=0; i<16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
                output.innerText = `Generated Password: ${pass}`;
            } else if(id === 23) {
                try { output.innerText = btoa(input); } catch(e) { output.innerText = "Error encoding!"; }
            } else if(id === 27) {
                const text = input || "https://fexatools.github.io";
                output.innerHTML = `<a href="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(text)}" target="_blank" class="text-accent-yellow underline font-bold">Click here to view your QR Code</a>`;
            } else if(id === 33) {
                const parts = input.split(/[\s,]+/);
                const weight = parseFloat(parts[0]);
                const height = parseFloat(parts[1]) / 100;
                const bmi = (weight / (height * height)).toFixed(1);
                output.innerText = isNaN(bmi) ? "Enter Weight(kg) & Height(cm) e.g. 70 175" : `Your BMI is ${bmi}`;
            } else if(id === 61 || id === 63) {
                const name = input || "My";
                output.innerText = `Shareable Quiz Link:\nhttps://fexatools.io/quiz?user=${encodeURIComponent(name)}`;
            } else if(id === 66) {
                output.innerText = `root@fexa-kali:~# nmap -sV target.local\n[+] Scan complete. Access Granted for ${input || 'User'}`;
            } else {
                if(!input) { output.innerText = "Please provide valid input data."; return; }
                output.innerText = `Processed Successfully: ${input}`;
            }
        }

        renderTools();
    </script>
</body>
